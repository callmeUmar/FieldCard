name: Backend tests

# Runs on every PR and every push to main, so a broken backend (e.g. a
# truncated file) shows a red check before it can be merged and deployed.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Tests never call Gemini, Photon or MongoDB (mongomock); this only lets modules import.
      GEMINI_API_KEY: dummy-for-tests
      MESSAGING: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
